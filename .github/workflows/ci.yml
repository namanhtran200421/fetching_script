name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies and checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install mypy pip-audit ruff
      - name: Lint
        run: python -m ruff check app tests
      - name: Type-check
        run: python -m mypy app
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q app tests
      - name: Audit dependencies
        # PYSEC-2026-2270 lists python-dotenv 1.2.2 as the fix, but that
        # release is not published on PyPI yet. Keep the audit active for all
        # other advisories and remove this exception when 1.2.2 is available.
        run: >-
          python -m pip_audit -r requirements.txt
          --ignore-vuln PYSEC-2026-2270
